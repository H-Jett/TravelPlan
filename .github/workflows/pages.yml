name: Deploy site to GitHub Pages

# 只在 main 上有源改动时重建并发布；产物 home/site/ 不进 git。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个发布，新的推送顶掉排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # 工具链不再是零依赖：拼真实地图底图要用 pngjs 解码/编码瓦片。
      - name: 安装依赖
        run: npm ci

      - name: 结构自检
        run: npm run check

      # 构建全程不联网：底图 PNG 已入库，且 trip-data.json 里的 realMaps 指纹
      # 一致时 build-real-map.mjs 会跳过抓瓦片，直接用仓库里已有的图。
      - name: 构建站点
        run: npm run build

      # 位置对不对 —— 没有这一步，投影再次被改坏也不会有人发现。
      - name: 校验地图投影
        run: npm run verify:projection

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: home/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
